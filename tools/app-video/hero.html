<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 1920x1080, 14초 반복. 홈 첫 화면 전체 장면 — 왼쪽은 페이지의 헤드라인 「아이디어 한 줄이 / 앱이 됩니다」 자리, 오른쪽이 그 한 줄이 앱이 되는 장면.
     배경: 퇴근길(0~4.5초, 문장을 치는 동안) → 밤의 유리 외벽(앱이 조립되는 동안). 사진 둘은 AI 생성.
     「퇴근길 10분, / 게임을 만들어 볼까, 서비스를 만들어 볼까?」가 타이핑되고 → 금빛 점이 되어 휴대폰으로 날아가고, 개발 체계 명령이 양옆을 지나고 → 앱이 조립되고 → 금빛이 번진다.
     처음과 끝은 깜빡이는 커서 하나라 이어 붙여도 끊기지 않는다.
     배경과 휴대폰 장면을 한 영상에 굽는다 — 따로 돌리면 영상이 반복할 때마다 생기는 지연만큼 배경과 박자가 밀린다.
     python3 tools/app-video/render.py tools/app-video/hero.html assets/brand/hero-scene.mp4 --duration 14 --size 1920x1080 --crf 24 --poster-at 11.2 -->
<style>
:root{--bg:#000;--ink:#f5f1e8;--teal:#5ec8b8;--gold:#c9a24a;--gold-hi:#f2d28b;--gold-lo:#7a5f24}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
[style*="animation-name"],.anim{animation-duration:14.0s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-iteration-count:infinite;animation-fill-mode:both}
.label{position:absolute;left:100px;top:106px;font:800 22px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;color:var(--gold);animation-name:label}
.idea{position:absolute;left:100px;top:150px;font-size:46px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;line-height:62px}
.idea span{display:inline-block;white-space:pre}
.cursor-wrap{position:absolute;inset:0;animation-name:cursor}
.cursor{position:absolute;left:100px;top:148px;width:4px;height:56px;animation-name:cursorx;animation-timing-function:steps(1,end)}
.cursor::before{content:'';position:absolute;inset:0;background:var(--gold-hi);animation:blink 1s steps(1,end) infinite}
.cmd{position:absolute;font:700 36px/1 ui-monospace,Menlo,monospace;color:var(--teal);display:flex;align-items:center;gap:18px;white-space:nowrap}
.cmd.L{flex-direction:row-reverse}
.cmd i{width:12px;height:12px;border-radius:50%;background:var(--teal);box-shadow:0 0 18px rgba(94,200,184,.8)}
svg.phone{position:absolute;left:366px;top:314px;overflow:visible}
svg.phone rect{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:2000;animation-name:outline}
.tile{position:absolute;border-radius:16px;border:2px solid var(--gold-lo);background:rgba(201,162,74,.08)}
.tile.bar{border-radius:10px;background:rgba(201,162,74,.16)}
.tile.btn{border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold-hi));border:0;box-shadow:0 10px 40px rgba(201,162,74,.45)}
.glow{position:absolute;left:150px;top:230px;width:780px;height:800px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(242,210,139,.42),rgba(201,162,74,.12) 45%,transparent 70%);mix-blend-mode:screen;animation-name:glow}
.screen{position:absolute;left:390px;top:350px;width:300px;height:560px;overflow:hidden;border-radius:28px}
.screen::after{content:'';position:absolute;top:-200px;left:30px;width:110px;height:1000px;
  background:linear-gradient(90deg,transparent,rgba(255,240,200,.5),transparent);filter:blur(8px);animation:sweep 14.0s linear infinite both}
/* 배경 — 퇴근길(0~4.5초) → 유리 외벽. 사진의 흐름과 빛줄기도 14초의 약수로 돌아 이음매가 없다 */
.shot{position:absolute;inset:-3%;background:center/cover no-repeat;filter:brightness(.62) saturate(.95);animation:drift 14.0s ease-in-out infinite both}
.shot.facade{background-image:url(../../assets/brand/hero-bg.jpg);background-position:70% 40%}
.shot.commute{background-image:url(../../assets/brand/hero-commute.jpg);background-position:55% 45%;filter:brightness(.7) saturate(1.05);
  animation:drift 14.0s ease-in-out infinite both,swap 14.0s ease-in-out infinite both}
@keyframes drift{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.05) translate(-1.5%,1%)}}
@keyframes swap{0%,30%{opacity:1}40%,93%{opacity:0}100%{opacity:1}}
.glint{position:absolute;height:2px;width:46%;transform-origin:left center;transform:rotate(-34deg);
  background:linear-gradient(90deg,transparent,rgba(242,210,139,0) 30%,rgba(255,236,190,.95) 50%,rgba(242,210,139,0) 70%,transparent) no-repeat;
  background-size:40% 100%;filter:blur(.6px) drop-shadow(0 0 6px rgba(242,210,139,.9));mix-blend-mode:screen;
  animation:glint 7s cubic-bezier(.4,0,.2,1) infinite both}
.glint.g1{left:44%;top:78%}
.glint.g2{left:58%;top:96%;width:52%;animation-duration:14.0s;animation-delay:-5s}
.glint.g3{left:66%;top:62%;width:38%;animation-duration:14.0s;animation-delay:-10s;opacity:.6}
@keyframes glint{0%,8%{background-position:-60% 0}46%,100%{background-position:160% 0}}
/* 휴대폰 장면 — 검정 바탕에 금빛만 그리고 screen 으로 얹는다 */
.reel{position:absolute;left:860px;top:27px;width:1080px;height:1080px;transform:scale(0.95);transform-origin:0 0;background:#000;mix-blend-mode:screen}
