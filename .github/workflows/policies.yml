# 정책 문서가 원본과 어긋나면 여기서 멈춘다.
#
# 이 검사가 무는 것은 셋이다:
#   · 커밋된 HTML 이 원본 마크다운에서 **다시 만들어지는가** (바이트 단위)
#   · 렌더된 본문의 글자와 링크가 **원본과 같은가** (assert_fidelity)
#   · 실행되거나 바깥을 부르는 태그가 **섞이지 않았는가** (assert_static_html)
#
# 손으로 HTML 을 고치면 첫째에서 잡힌다. 렌더러를 고쳤는데 어느 앱의 문서든 한 글자라도
# 달라지면 그것도 첫째에서 잡힌다 — 그것이 앱 넷이 한 렌더러를 쓰면서도 안심하는 이유다.
name: policies

on:
  push:
    paths: ['*/policies/**', 'tools/**', '.github/workflows/policies.yml']
  pull_request:
    paths: ['*/policies/**', 'tools/**', '.github/workflows/policies.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 렌더러 단위 검사
        run: uv run --no-project tools/test_render.py
      - name: 커밋된 HTML 이 원본에서 다시 만들어지는가
        run: |
          for app in word-doodle piclect ururu; do
            uv run --no-project tools/render-policies.py "$app" --check
          done
